<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="jogo de cartas super trunfo, javaScript,CSS">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <meta name="author" content="Taynara Santos Sousa">
    <meta name="robots" content="index,follow">
    <link rel="shortcut icon" href="img/icone cartas.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <title>Super Trunfo - Gigantes da Tecnologia</title>
</head>

<body>
<video autoplay muted loop id="bg-video">
    <source src="video/baralho.mp4" type="video/mp4">
</video>

    <div class="container">
        <h1>Trunfo de cartas</h1>
        <div class="placar">
            <div id="placar-jogador">Jogador: 0</div>
            <div id="placar-maquina">Máquina: 0</div>
        </div>

        <div class="arena">
            <div id="carta-jogador" class="carta"></div>
            <div id="carta-maquina" class="carta verso"></div>
        </div>

        <div class="controles">
            <button id="btn-jogar">Jogar</button>
            <button id="btn-pausar" disabled>Pausar</button>
            <button id="btn-proxima-rodada" disabled>Próxima Rodada</button>

            <div id="pause-overlay" class="pause-overlay hidden">
                <h2>Jogo Pausado</h2>
            </div>
        </div>
        <div id="resultado" class="resultado"></div>

        <audio id="sound-win" src="https://www.myinstants.com/media/sounds/coin.mp3" preload="auto"></audio>
        <audio id="sound-lose" src="https://www.myinstants.com/media/sounds/erro.mp3" preload="auto"></audio>

        <script src="js/cartas.js"></script>
        <script src="js/script.js"></script>
    </div>
</body>

</html>
